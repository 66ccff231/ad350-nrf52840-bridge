# 在 GitHub 上自动编译固件 —— 不需要你本地安装 nRF Connect SDK
#
# 设计说明：
#   不用容器（container:），因为容器任务里 actions/checkout 常因 git
#   「dubious ownership」失败（容器内是 root，workspace 属主不同）。
#   改为在标准 ubuntu runner 上装 west + Zephyr SDK，多花一点时间但稳定。
#
# 用法：
#   推送后自动构建 → Actions 页面下载 artifacts 里的 zephyr.uf2
#   如果报 board not found，改下面的 BOARD 变量

name: Build nRF52840 firmware

on:
  push:
  workflow_dispatch:

env:
  BOARD: promicro_nrf52840/nrf52840/uf2
  ZEPHYR_SDK_VERSION: 0.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget python3 python3-pip python3-setuptools python3-tk python3-wheel \
            xz-utils file make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install west and Zephyr dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install west

      - name: Init west workspace (Zephyr 4.x)
        run: |
          west init -l .
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Python requirements
        run: python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          cd ..
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz
          cd zephyr-sdk-${ZEPHYR_SDK_VERSION}
          ./setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD" >> $GITHUB_ENV

      - name: Build firmware
        run: |
          west build -b "$BOARD" . --pristine

      - name: Show what was produced
        if: always()
        run: |
          echo "--- 产物 ---"
          ls -la build/zephyr/ 2>/dev/null | head -30 || echo "build 目录不存在"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: xds-bridge-uf2
          path: |
            build/zephyr/zephyr.uf2
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.elf
          if-no-files-found: warn
