# XDS 功率计 BLE 桥接 —— Zephyr 配置
# 目标：nRF52840，同时做 BLE Central（连功率计）和 Peripheral（冒充功率计）

# --- 蓝牙基础 ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y          # 需要扫描功率计
CONFIG_BT_GATT_CLIENT=y       # 需要订阅功率计的 0x2A63

# 状态指示灯（板载 LED0 = P0.15）
CONFIG_GPIO=y

# bt_gatt_service_register()（运行时注册服务）在较新 Zephyr 里
# 属于动态 GATT 数据库特性，不开启会链接失败：
#   undefined reference to `bt_gatt_service_register'
CONFIG_BT_GATT_DYNAMIC_DB=y

# 一个到功率计的连接（Central）+ 一个码表连接（Peripheral），留点余量
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=2

# --- 配对支持 ---
# 之前完全没开 SMP，手机发起配对时设备回「不支持配对」，
# 系统蓝牙显示「拒绝配对」；不少运动 app 只列出能配对的设备，
# 所以这很可能也是行者 app 搜不到的原因之一。
# 说明：未启用 CONFIG_BT_SETTINGS，配对密钥只保存在内存里，
# 断电后需要重新配对；对「一路骑行期间保持供电」的用法够用。
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# 设备名（也会写进扫描响应）
CONFIG_BT_DEVICE_NAME="XDS Power Bridge"

# --- 日志 ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- USB CDC ACM 控制台 ---
# 板子的 usbd 已启用（见板级 DTS），把 console 与日志接到 USB 虚拟串口，
# 这样同一根 USB 线既能供电/烧录，也能看日志。见同名 overlay 文件。
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG_BACKEND_UART=y

# --- 内存 ---
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
